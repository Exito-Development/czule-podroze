# Lista uczestniczek wyjazdu i wiadomości do nich.
databaseChangeLog:
  - changeSet:
      id: participants
      author: czula-podroz
      comment: 'Jedna osoba na jednym miejscu: zamówienie na trzy miejsca daje trzy wiersze.'
      changes:
        - createTable:
            tableName: participants
            remarks: 'Jedna osoba na jednym miejscu: zamówienie na trzy miejsca daje trzy wiersze.'
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_participants
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: version
                  type: BIGINT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: trip_id
                  type: UUID
                  constraints:
                    nullable: false
                    foreignKeyName: fk_participants_trip
                    references: trips(id)
                    deleteCascade: true
              - column:
                  name: order_id
                  type: UUID
                  constraints:
                    nullable: false
                    foreignKeyName: fk_participants_order
                    references: orders(id)
                    deleteCascade: true
              - column:
                  name: order_item_id
                  type: UUID
                  constraints:
                    nullable: false
                    foreignKeyName: fk_participants_order_item
                    references: order_items(id)
                    deleteCascade: true
              - column:
                  name: seat_number
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: first_name
                  type: VARCHAR(120)
                  constraints:
                    nullable: true
              - column:
                  name: last_name
                  type: VARCHAR(120)
                  constraints:
                    nullable: true
              - column:
                  name: email
                  type: VARCHAR(320)
                  constraints:
                    nullable: true
              - column:
                  name: phone
                  type: VARCHAR(40)
                  constraints:
                    nullable: true
              - column:
                  name: note
                  type: VARCHAR(2000)
                  constraints:
                    nullable: true
              - column:
                  name: contact_person
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            tableName: participants
            columnNames: order_item_id, seat_number
            constraintName: uk_participants_seat
        - createIndex:
            tableName: participants
            indexName: ix_participants_trip
            columns:
              - column:
                  name: trip_id
              - column:
                  name: status
        - createIndex:
            tableName: participants
            indexName: ix_participants_order
            columns:
              - column:
                  name: order_id
        - sql:
            dbms: postgresql,h2
            sql: alter table participants add constraint ck_participants_seat check (seat_number > 0)
      rollback:
        - sql:
            dbms: postgresql,h2
            sql: alter table participants drop constraint ck_participants_seat
        - dropTable:
            tableName: participants

  - changeSet:
      id: trip_messages
      author: czula-podroz
      comment: 'Wiadomość wysłana do grupy odbiorczyń wyjazdu.'
      changes:
        - createTable:
            tableName: trip_messages
            remarks: 'Wiadomość wysłana do grupy odbiorczyń wyjazdu.'
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_trip_messages
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: version
                  type: BIGINT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: trip_id
                  type: UUID
                  constraints:
                    nullable: false
                    foreignKeyName: fk_trip_messages_trip
                    references: trips(id)
                    deleteCascade: true
              - column:
                  name: subject
                  type: VARCHAR(200)
                  constraints:
                    nullable: false
              - column:
                  name: body
                  type: VARCHAR(10000)
                  constraints:
                    nullable: false
              - column:
                  name: audience
                  type: VARCHAR(30)
                  constraints:
                    nullable: false
              - column:
                  name: sent_by
                  type: VARCHAR(320)
                  constraints:
                    nullable: false
              - column:
                  name: sent_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: recipient_count
                  type: INT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: failed_count
                  type: INT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: provider
                  type: VARCHAR(40)
                  constraints:
                    nullable: false
        - createIndex:
            tableName: trip_messages
            indexName: ix_trip_messages_trip
            columns:
              - column:
                  name: trip_id
              - column:
                  name: sent_at

  - changeSet:
      id: message_deliveries
      author: czula-podroz
      comment: 'Wynik doręczenia wiadomości do jednej osoby.'
      changes:
        - createTable:
            tableName: message_deliveries
            remarks: 'Wynik doręczenia wiadomości do jednej osoby.'
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_message_deliveries
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: version
                  type: BIGINT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: message_id
                  type: UUID
                  constraints:
                    nullable: false
                    foreignKeyName: fk_message_deliveries_message
                    references: trip_messages(id)
                    deleteCascade: true
              - column:
                  name: recipient_name
                  type: VARCHAR(240)
                  constraints:
                    nullable: true
              - column:
                  name: recipient_email
                  type: VARCHAR(320)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: failure_reason
                  type: VARCHAR(500)
                  constraints:
                    nullable: true
        - createIndex:
            tableName: message_deliveries
            indexName: ix_message_deliveries_message
            columns:
              - column:
                  name: message_id
