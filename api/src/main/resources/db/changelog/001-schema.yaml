# Czuła Podróż — schemat początkowy.
#
# Typy są opisane abstrakcyjnie (UUID, NUMERIC, TIMESTAMP WITH TIME ZONE),
# więc Liquibase generuje właściwy dialekt dla PostgreSQL (produkcja)
# i H2 (środowisko lokalne oraz testy).
databaseChangeLog:
  - changeSet:
      id: trips
      author: czula-podroz
      comment: 'Wyjazdy — korzeń oferty.'
      changes:
        - createTable:
            tableName: trips
            remarks: 'Wyjazdy — korzeń oferty.'
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_trips
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: version
                  type: BIGINT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: slug
                  type: VARCHAR(120)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uk_trips_slug
              - column:
                  name: title
                  type: VARCHAR(160)
                  constraints:
                    nullable: false
              - column:
                  name: tagline
                  type: VARCHAR(300)
                  constraints:
                    nullable: false
              - column:
                  name: continent
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: country
                  type: VARCHAR(120)
                  constraints:
                    nullable: false
              - column:
                  name: duration_days
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: start_date
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: end_date
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: price
                  type: NUMERIC(12, 2)
                  constraints:
                    nullable: false
              - column:
                  name: deposit
                  type: NUMERIC(12, 2)
                  constraints:
                    nullable: false
              - column:
                  name: capacity
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: booked_seats
                  type: INT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: published
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: cover_image
                  type: VARCHAR(500)
                  constraints:
                    nullable: false
        - sql:
            dbms: postgresql,h2
            sql: alter table trips add constraint ck_trips_capacity check (capacity >= 0)
        - sql:
            dbms: postgresql,h2
            sql: alter table trips add constraint ck_trips_booked check (booked_seats >= 0 and booked_seats <= capacity)
      rollback:
        - sql:
            dbms: postgresql,h2
            sql: alter table trips drop constraint ck_trips_capacity
        - sql:
            dbms: postgresql,h2
            sql: alter table trips drop constraint ck_trips_booked
        - dropTable:
            tableName: trips

