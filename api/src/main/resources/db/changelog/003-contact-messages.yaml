# Wiadomości z formularza kontaktowego na stronie.
databaseChangeLog:
  - changeSet:
      id: contact_messages
      author: czula-podroz
      comment: 'Pytania wysyłane przez formularz na stronie.'
      changes:
        - createTable:
            tableName: contact_messages
            remarks: 'Wiadomości z formularza kontaktowego.'
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_contact_messages
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: version
                  type: BIGINT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(160)
                  constraints:
                    nullable: false
              - column:
                  name: email
                  type: VARCHAR(320)
                  constraints:
                    nullable: false
              - column:
                  name: phone
                  type: VARCHAR(40)
              - column:
                  name: topic
                  type: VARCHAR(80)
              - column:
                  name: message
                  type: VARCHAR(4000)
                  constraints:
                    nullable: false
              - column:
                  name: handled_at
                  type: TIMESTAMP WITH TIME ZONE
        - createIndex:
            # Lista w panelu zawsze idzie od najnowszych.
            indexName: idx_contact_messages_created_at
            tableName: contact_messages
            columns:
              - column:
                  name: created_at
                  descending: true
      rollback:
        - dropTable:
            tableName: contact_messages
