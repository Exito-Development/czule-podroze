# Profil produkcyjny — wszystko wrażliwe pochodzi ze zmiennych środowiskowych.
# Aplikacja nie wstanie bez JWT_SECRET i danych bazy; to celowe.
spring:
  datasource:
    # Jedna zmienna wystarczy. DATABASE_URL z usługi bazy ma postać
    # `postgresql://login:haslo@host:5432/baza`, a DatabaseUrlNormalizer
    # zamienia ją przed startem puli na adres JDBC i wyciąga z niej dane
    # logowania. Nie ma więc czego przepisywać ręcznie do trzech zmiennych.
    url: ${DATABASE_URL}
    # Używane tylko wtedy, gdy adres NIE zawiera danych logowania.
    username: ${PGUSER:}
    password: ${PGPASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  liquibase:
    contexts: prod

czula:
  frontend:
    base-url: ${FRONTEND_BASE_URL}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  payments:
    provider: ${PAYMENTS_PROVIDER:mock}
    api-base-url: ${API_BASE_URL}
  admin:
    # Konto organizatorki zakładane przy pierwszym starcie, jeśli jeszcze nie
    # istnieje. Bez tego po wdrożeniu nie ma się czym zalogować do panelu,
    # więc nie da się dodać żadnego wyjazdu i katalog zostaje pusty.
    bootstrap-email: ${ADMIN_EMAIL:}
    bootstrap-password: ${ADMIN_PASSWORD:}

logging:
  level:
    pl.czulapodroz.api: INFO
