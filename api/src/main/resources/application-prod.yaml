# Profil produkcyjny — wszystko wrażliwe pochodzi ze zmiennych środowiskowych.
# Aplikacja nie wstanie bez JWT_SECRET i danych bazy; to celowe.
spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  liquibase:
    # Bez danych przykładowych — kontekst `seed` się tu nie pojawia.
    contexts: prod

czula:
  payments:
    provider: ${PAYMENTS_PROVIDER:mock}
  admin:
    # Konto organizatorki zakładane przy pierwszym starcie, jeśli jeszcze nie
    # istnieje. Bez tego po wdrożeniu nie ma się czym zalogować do panelu,
    # więc nie da się dodać żadnego wyjazdu i katalog zostaje pusty.
    #
    # Świadomie BEZ wartości domyślnych: konto z hasłem wpisanym w repozytorium
    # byłoby gotowym wejściem do panelu dla każdego, kto zna ten kod. Gdy
    # zmienne nie są ustawione, konto po prostu nie powstaje.
    bootstrap-email: ${ADMIN_EMAIL:}
    bootstrap-password: ${ADMIN_PASSWORD:}

logging:
  level:
    pl.czulapodroz.api: INFO
