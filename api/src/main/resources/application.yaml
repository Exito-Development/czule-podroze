spring:
  application:
    name: czula-podroz-api
  profiles:
    default: local
  jpa:
    open-in-view: false
    hibernate:
      # Schematem zarządza Flyway; Hibernate ma go tylko sprawdzać.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
        # Ogranicza N+1 przy wczytywaniu planów wyjazdów.
        default_batch_fetch_size: 50
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    # Jackson 3 (Spring Boot 4) domyślnie serializuje daty jako ISO-8601,
    # więc wystarczy pominąć puste pola w odpowiedziach.
    default-property-inclusion: non_null
  threads:
    virtual:
      enabled: true

server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

czula:
  frontend:
    base-url: ${FRONTEND_BASE_URL:http://localhost:3002}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3002}
  catalog:
    few-left-threshold: 3
  booking:
    # Ile czasu koszyk trzyma miejsce bez złożenia zamówienia.
    hold-duration: PT20M
    # Ile czasu na opłacenie złożonego zamówienia.
    payment-window: PT60M
    max-seats-per-item: 4
    expiry-scan-interval: PT1M
    unpaid-scan-interval: PT5M
  payments:
    provider: ${PAYMENTS_PROVIDER:mock}
    api-base-url: ${API_BASE_URL:http://localhost:8080}
    webhook-secret: ${PAYMENTS_WEBHOOK_SECRET:}
  security:
    jwt:
      secret: ${JWT_SECRET:}
      issuer: czula-podroz-api
      access-token-ttl: PT15M
      refresh-token-ttl: P14D

logging:
  level:
    pl.czulapodroz.api: INFO
