spring:
  application:
    name: czula-podroz-api
  profiles:
    default: local
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
        default_batch_fetch_size: 50
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
    analytics-enabled: false
    contexts: ${LIQUIBASE_CONTEXTS:prod}
  jackson:
    default-property-inclusion: non_null
  threads:
    virtual:
      enabled: true
  web:
    error:
      include-stacktrace: never
      include-message: never

server:
  port: ${PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

czula:
  frontend:
    base-url: ${FRONTEND_BASE_URL:http://localhost:3002}
  cors:
    # 3002 — strona sprzedażowa, 3003 — panel organizatorek.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3002,http://localhost:3003}
  catalog:
    few-left-threshold: 3
  booking:
    # Ile czasu koszyk trzyma miejsce bez złożenia zamówienia.
    hold-duration: PT20M
    # Ile czasu na opłacenie złożonego zamówienia.
    payment-window: PT60M
    max-seats-per-item: 4
    expiry-scan-interval: PT1M
    unpaid-scan-interval: PT5M
  messaging:
    # `log` — wiadomości trafiają do logu (środowisko lokalne i testy).
    # `smtp` — prawdziwa wysyłka; dane serwera w `spring.mail.*`.
    provider: ${MESSAGING_PROVIDER:log}
    from-name: Czuła Podróż
    from-email: ${MESSAGING_FROM_EMAIL:kontakt@czulapodroz.pl}
  payments:
    provider: ${PAYMENTS_PROVIDER:mock}
    api-base-url: ${API_BASE_URL:http://localhost:8080}
    webhook-secret: ${PAYMENTS_WEBHOOK_SECRET:}
  security:
    jwt:
      secret: ${JWT_SECRET:}
      issuer: czula-podroz-api
      access-token-ttl: PT15M
      refresh-token-ttl: P14D

logging:
  level:
    pl.czulapodroz.api: INFO
